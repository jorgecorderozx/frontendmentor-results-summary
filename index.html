<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>

</head>

<body>

  <main class="card flex">
    <section class="resultCard card flex">
      <p class="resultTitle">Your Result</p>
      <div class="circle flex">
        <span class="result">76</span>
        <p>of 100</p>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary card flex">
      <h2>Summary</h2>
      <ul class="flex">
        <li class="flex">
          <div class="flex">
            <img src="assets/images/icon-reaction.svg">
            <p class="quality reaction">Reaction</p>
          </div>
          <span class="rating"><span class="ratingOutput">80</span> / 100</span>
        </li>
        <li class="flex">
          <div class="flex">
            <img src="assets/images/icon-memory.svg">
            <p class="quality memory">Memory</p>
          </div>
          <span class="rating"><span class="ratingOutput">92</span> / 100</span>
        </li>
        <li class="flex">
          <div class="flex">
            <img src="assets/images/icon-verbal.svg">
            <p class="quality verbal">Verbal</p>
          </div>
          <span class="rating"><span class="ratingOutput">61</span> / 100</span>
        </li>
        <li class="flex">
          <div class="flex">
            <img src="assets/images/icon-visual.svg">
            <p class="quality visual">Visual</p>
          </div>
          <span class="rating"><span class="ratingOutput">72</span> / 100</span>
        </li>
      </ul>
      <button>Continue</button>
    </section>
  </main>

</body>

</html>
